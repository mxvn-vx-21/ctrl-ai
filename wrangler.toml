name = "ctrl-monster"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[vars]
APP_URL = "https://ctrl.monster"
SITES_DOMAIN = "ctrl.monster"
AUTH_FROM_EMAIL = "CTRL <noreply@ctrl.monster>"

[[d1_databases]]
binding = "DB"
database_name = "ctrl"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SITES"
bucket_name = "ctrl-sites"
